{% extends "auth_layout.html" %}
{% block title %}Register – TechRoom Manager{% endblock %}

{% block content %}
<div class="auth-card auth-card-wide">
  <div class="auth-header">
    <div class="auth-logo">
      <i class="fa-solid fa-microchip"></i>
    </div>
    <h1 class="auth-title">TechRoom</h1>
    <p class="auth-subtitle">Device Management System</p>
  </div>

  <div class="auth-body">
    <h2 class="form-heading">Create Account</h2>
    <p class="form-subheading">Fill in the details to register</p>

    <form method="POST" action="{{ url_for('register') }}" novalidate id="registerForm">
      <div class="form-group">
        <label class="form-label" for="username">
          <i class="fa-solid fa-user"></i> Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Choose a username (min 3 chars)"
          required
          minlength="3"
        />
        <span class="field-hint">At least 3 characters, no spaces.</span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="password">
            <i class="fa-solid fa-lock"></i> Password
          </label>
          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              class="form-control"
              placeholder="Min 6 characters"
              required
              minlength="6"
            />
            <button type="button" class="input-eye" onclick="togglePassword('password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">
            <i class="fa-solid fa-lock-open"></i> Confirm Password
          </label>
          <div class="input-group">
            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              class="form-control"
              placeholder="Re-enter password"
              required
            />
            <button type="button" class="input-eye" onclick="togglePassword('confirm_password', this)">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">
          <i class="fa-solid fa-shield-halved"></i> Account Role
        </label>
        <div class="role-selector">
          <label class="role-option">
            <input type="radio" name="role" value="user" checked>
            <div class="role-card">
              <i class="fa-solid fa-user"></i>
              <strong>User</strong>
              <small>Add records only</small>
            </div>
          </label>
          <label class="role-option">
            <input type="radio" name="role" value="admin">
            <div class="role-card">
              <i class="fa-solid fa-user-gear"></i>
              <strong>Admin</strong>
              <small>Full access</small>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa-solid fa-user-plus"></i>
        Create Account
      </button>
    </form>

    <p class="auth-switch">
      Already have an account?
      <a href="{{ url_for('login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
