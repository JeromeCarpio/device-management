{% extends "auth_layout.html" %}
{% block title %}Login – TechRoom Manager{% endblock %}

{% block content %}
<div class="auth-card">
  <div class="auth-header">
    <div class="auth-logo">
      <i class="fa-solid fa-microchip"></i>
    </div>
    <h1 class="auth-title">TechRoom</h1>
    <p class="auth-subtitle">Device Management System</p>
  </div>

  <div class="auth-body">
    <h2 class="form-heading">Sign In</h2>
    <p class="form-subheading">Enter your credentials to continue</p>

    <form method="POST" action="{{ url_for('login') }}" novalidate>
      <div class="form-group">
        <label class="form-label" for="username">
          <i class="fa-solid fa-user"></i> Username
        </label>
        <input
          type="text"
          id="username"
          name="username"
          class="form-control"
          placeholder="Enter your username"
          required
          autocomplete="username"
        />
      </div>

      <div class="form-group">
        <label class="form-label" for="password">
          <i class="fa-solid fa-lock"></i> Password
        </label>
        <div class="input-group">
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          />
          <button type="button" class="input-eye" onclick="togglePassword('password', this)">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-full">
        <i class="fa-solid fa-right-to-bracket"></i>
        Sign In
      </button>
    </form>

    <p class="auth-switch">
      Don't have an account?
      <a href="{{ url_for('register') }}">Create one</a>
    </p>
  </div>
</div>
{% endblock %}
