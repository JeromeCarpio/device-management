{% extends "layout.html" %}
{% block title %}Edit Device – TechRoom Manager{% endblock %}
{% block page_title %}Edit Device Record{% endblock %}

{% block content %}
<div class="form-page-wrapper">
  <div class="card form-card">
    <div class="card-header">
      <h3 class="card-title"><i class="fa-solid fa-pen-to-square"></i> Edit Record #{{ device.id }}</h3>
      <a href="{{ url_for('devices') }}" class="btn btn-sm btn-ghost">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
    </div>
    <div class="card-body">
      <form method="POST" action="{{ url_for('edit_device', device_id=device.id) }}" novalidate>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="device_type">
              <i class="fa-solid fa-laptop"></i> Device Type <span class="required">*</span>
            </label>
            <select name="device_type" id="device_type" class="form-control" required>
              {% set types = ['Laptop','Desktop Computer','Monitor','Printer','Scanner','Projector',
                              'Router / Switch','Keyboard','Mouse','Webcam','Hard Drive / SSD',
                              'UPS / Power Supply','Tablet','Smartphone','Other'] %}
              {% for t in types %}
              <option {% if device.device_type == t %}selected{% endif %}>{{ t }}</option>
              {% endfor %}
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="brand_name">
              <i class="fa-solid fa-tag"></i> Brand Name <span class="required">*</span>
            </label>
            <input
              type="text"
              id="brand_name"
              name="brand_name"
              class="form-control"
              value="{{ device.brand_name }}"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="serial_number">
              <i class="fa-solid fa-barcode"></i> Serial Number <span class="required">*</span>
            </label>
            <input
              type="text"
              id="serial_number"
              name="serial_number"
              class="form-control mono-input"
              value="{{ device.serial_number }}"
              required
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="department">
              <i class="fa-solid fa-building"></i> Department <span class="required">*</span>
            </label>
            <input
              type="text"
              id="department"
              name="department"
              class="form-control"
              value="{{ device.department }}"
              list="dept-suggestions"
              required
            />
            <datalist id="dept-suggestions">
              <option>IT Department</option>
              <option>Human Resources</option>
              <option>Finance</option>
              <option>Operations</option>
              <option>Marketing</option>
              <option>Administration</option>
            </datalist>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">
              <i class="fa-solid fa-arrows-left-right"></i> Status <span class="required">*</span>
            </label>
            <div class="status-selector">
              <label class="status-option">
                <input type="radio" name="status" value="incoming" {% if device.status == 'incoming' %}checked{% endif %}>
                <div class="status-card status-incoming">
                  <i class="fa-solid fa-arrow-down-to-bracket"></i>
                  <strong>Incoming</strong>
                </div>
              </label>
              <label class="status-option">
                <input type="radio" name="status" value="outgoing" {% if device.status == 'outgoing' %}checked{% endif %}>
                <div class="status-card status-outgoing">
                  <i class="fa-solid fa-arrow-up-from-bracket"></i>
                  <strong>Outgoing</strong>
                </div>
              </label>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label" for="date">
              <i class="fa-solid fa-calendar"></i> Date <span class="required">*</span>
            </label>
            <input
              type="date"
              id="date"
              name="date"
              class="form-control"
              value="{{ device.date }}"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="remarks">
            <i class="fa-solid fa-note-sticky"></i> Remarks / Notes
          </label>
          <textarea
            id="remarks"
            name="remarks"
            class="form-control"
            rows="3"
          >{{ device.remarks or '' }}</textarea>
        </div>

        <div class="form-actions">
          <a href="{{ url_for('devices') }}" class="btn btn-ghost">
            <i class="fa-solid fa-xmark"></i> Cancel
          </a>
          <button type="submit" class="btn btn-primary">
            <i class="fa-solid fa-floppy-disk"></i> Update Record
          </button>
        </div>

      </form>
    </div>
  </div>
</div>
{% endblock %}
